services:
  gateway:
    build: .
    image: xiaoxiao-ai-gateway:latest
    container_name: xiaoxiao-gateway
    restart: unless-stopped
    ports:
      - "8848:8848"   # 官网 + 管理后台
      - "8849:8849"   # 用户中心
    environment:
      HOST: 0.0.0.0
      PORT: 8848
      USER_PORT: 8849
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8848/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
